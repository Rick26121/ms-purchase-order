version: '3.8'

services:
  app:
    build: .
    image: misuper-app:latest
    container_name: misuper_app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - misuper

  webserver:
    image: nginx:alpine
    container_name: misuper_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - misuper

networks:
  misuper:
    driver: bridge